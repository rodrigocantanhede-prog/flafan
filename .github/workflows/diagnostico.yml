# Temporário: estuda o site da CONMEBOL. Será removido.
name: Diagnóstico CONMEBOL
on:
  push:
    branches: [main]
    paths: ['scripts/diagnostico-conmebol.mjs']
permissions:
  contents: write
concurrency:
  group: atualizar-jogos
  cancel-in-progress: false
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/diagnostico-conmebol.mjs
      - run: |
          git config user.name "FlaFan robô"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostico
          git diff --cached --quiet || git commit -m "Diagnóstico: CONMEBOL"
          git pull --rebase origin main
          git push
