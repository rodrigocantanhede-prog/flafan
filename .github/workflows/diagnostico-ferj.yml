# Temporário: testa a paginação da FERJ. Será apagado depois do teste.
name: Diagnóstico FERJ
on:
  push:
    branches: [main]
    paths: ['scripts/diag-ferj.mjs', '.github/workflows/diagnostico-ferj.yml']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/diag-ferj.mjs
      - name: Salvar
        if: always()
        run: |
          git config user.name "FlaFan robô"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostico
          git diff --cached --quiet || git commit -m "Diagnóstico: FERJ"
          for t in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
