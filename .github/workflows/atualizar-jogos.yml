# Roda a cada 3 horas (e quando você clicar em "Run workflow" ou quando o código do robô muda).
name: Atualizar jogos
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'config.json', '.github/workflows/**']
concurrency:
  group: atualizar-jogos
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar jogos (API + planilha)
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: node scripts/atualizar.mjs
      - name: Salvar se algo mudou
        run: |
          git config user.name "FlaFan robô"
          git config user.email "actions@users.noreply.github.com"
          git add data escudos
          git diff --cached --quiet || git commit -m "Atualização automática dos jogos"
          git pull --rebase origin main
          git push
